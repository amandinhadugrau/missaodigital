<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌟 Renova Brasil: Eco-Edition 🌟</title>
    <link rel="stylesheet" href="style.css">
    <!-- Fonte pixelada/retro para dar o clima dos anos 2000 -->
    <link href="https://googleapis.com" rel="stylesheet">
</head>
<body>

    <div class="game-container">
        <header>
            <h1>✨Renova Brasil ✨</h1>
            <p class="subtitle">~ Eco-Edition 2004 ~</p>
        </header>

        <div class="character-box">
            <span class="avatar">💅</span>
            <div class="char-info">
                <strong>Status da Tiffany:</strong> <span id="status">Pronta pro bafão</span>
            </div>
        </div>

        <main class="story-box">
            <p id="story-text">Carregando a história...</p>
        </main>

        <div id="choices-container" class="choices-box">
            <!-- Os botões de escolha vão aparecer aqui dinamicamente -->
        </div>
    </div>

    <script href="script.js"></script>
</body>
</html>
